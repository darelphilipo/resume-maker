name: OpenCode Autopilot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: opencode-autopilot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build-next-task:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Restore OpenCode state & stats DB
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/opencode
          key: opencode-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            opencode-state-${{ runner.os }}-

      - name: Install OpenCode CLI
        # The free tier refuses to run below 1.18.0 and still exits 0:
        #   "Error: OpenCode 1.18.0 or newer is required to use the free tier"
        # Do not downgrade this pin.
        run: npm install -g @opencode/cli@latest

      - name: Pre-run adaptive gate & model selection
        id: gate
        run: |
          mkdir -p "$HOME/.local/share/opencode"
          STATE_FILE="$HOME/.local/share/opencode/autopilot-state.json"
          STATS_JSON=$(opencode stats --days 1 --format json 2>/dev/null || echo "{}")
          export STATS_JSON STATE_FILE

          node - <<'NODE_EOF' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const stateFile = process.env.STATE_FILE;

          let state = {
            deepseekCooldownUntil: 0,
            hy4CooldownUntil: 0,
            consecutiveDeepseekLimits: 0,
            consecutiveTimeouts: 0,
            timeoutMins: 12,
            recentRuns: []
          };
          if (fs.existsSync(stateFile)) {
            try { state = { ...state, ...JSON.parse(fs.readFileSync(stateFile, "utf8")) }; } catch {}
          }

          const now = Date.now();
          const dayAgo = now - 24 * 60 * 60 * 1000;
          state.recentRuns = (state.recentRuns || []).filter((ts) => ts > dayAgo);

          let reqs24h = 0;
          try {
            const stats = JSON.parse(process.env.STATS_JSON || "{}");
            reqs24h = Number(stats.totalRequests ?? stats.requests ?? stats.total_requests ?? 0) || 0;
          } catch {}

          const deepseekCooling = now < (state.deepseekCooldownUntil || 0);
          const hy4Cooling = now < (state.hy4CooldownUntil || 0);
          const softCapHit = reqs24h >= 320 || state.recentRuns.length >= 10;

          let primaryModel = "opencode/deepseek-v4.1-flash-free";
          let skip = false;
          let skipReason = "none";

          if (deepseekCooling && !hy4Cooling) {
            primaryModel = "opencode/hy4-flash-free";
          } else if (deepseekCooling && hy4Cooling) {
            const minsLeft = Math.ceil(
              (Math.min(state.deepseekCooldownUntil, state.hy4CooldownUntil) - now) / 60000
            );
            skip = true;
            skipReason = `Both DeepSeek and Hy4 Flash in cooldown (~${minsLeft}m left)`;
          } else if (softCapHit && hy4Cooling) {
            skip = true;
            skipReason = `24h soft cap reached (reqs24h=${reqs24h}, runs24h=${state.recentRuns.length}) and Hy4 in cooldown`;
          } else if (softCapHit && !hy4Cooling) {
            primaryModel = "opencode/hy4-flash-free";
          }

          const timeoutMins = Math.min(20, Math.max(12, Number(state.timeoutMins) || 12));
          console.log(`skip=${skip}`);
          console.log(`skip_reason=${skipReason}`);
          console.log(`primary_model=${primaryModel}`);
          console.log(`hy4_cooling=${hy4Cooling}`);
          console.log(`timeout_mins=${timeoutMins}`);
          NODE_EOF

      - name: Log gate skip to summary
        if: steps.gate.outputs.skip == 'true'
        run: |
          {
            echo "### OpenCode Autopilot Skipped"
            echo "- **Reason:** ${{ steps.gate.outputs.skip_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resume WIP checkpoint if ahead of main
        if: steps.gate.outputs.skip != 'true'
        run: |
          if git ls-remote --exit-code --heads origin wip/opencode-checkpoint >/dev/null 2>&1; then
            AHEAD=$(git rev-list --count origin/main..origin/wip/opencode-checkpoint)
            if [ "$AHEAD" -gt 0 ]; then
              echo "Resuming from wip/opencode-checkpoint ($AHEAD commit(s) ahead of main)"
              git checkout -B work-branch origin/wip/opencode-checkpoint
            fi
          fi

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Run OpenCode on 1 task from TASKS.md (with Hy4 Flash fallback)
        if: steps.gate.outputs.skip != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_KEY }}
          TIMEOUT_MINS: ${{ steps.gate.outputs.timeout_mins }}
          PRIMARY_MODEL: ${{ steps.gate.outputs.primary_model }}
          HY4_COOLING: ${{ steps.gate.outputs.hy4_cooling }}
        run: |
          set +e
          PROMPT=$(cat <<'PROMPT_EOF'
          Read AGENTS.md , TASKS.md and CONTEXT.md first.

          1. If there is an item under 'In Progress', continue it. Otherwise, pick the single top unchecked item from 'Queue' (or promote 1 clear item from 'Inbox' if Queue is empty).
          2. Move that item to 'In Progress' in TASKS.md with a brief plan and target file paths.
          3. Implement the change cleanly following mobile-first, static-export, and existing test conventions. Add or update unit tests where appropriate.
          4. Run: npm run typecheck && npm test
          5. If checks pass, move the item to 'Done' in TASKS.md (with date and files changed). If you hit errors or run short on time, keep it under 'In Progress' with exact next steps for the next run.
          6. Stop after this single task. Do NOT run git commit or git push.
          PROMPT_EOF
          )

          LOG_FILE="$RUNNER_TEMP/opencode-run.log"
          : > "$LOG_FILE"

          run_model() {
            local model="$1"
            echo "=== Attempting model: $model (timeout=${TIMEOUT_MINS}m) ===" >> "$LOG_FILE"
            timeout "${TIMEOUT_MINS}m" opencode run \
              --dangerously-skip-permissions \
              -m "$model" \
              "$PROMPT" >> "$LOG_FILE" 2>&1
            local rc=$?
            cat "$LOG_FILE"
            return "$rc"
          }

          ACTIVE_MODEL="$PRIMARY_MODEL"
          run_model "$ACTIVE_MODEL"
          EXIT_CODE=$?
          DEEPSEEK_LIMITED="false"
          HY4_FAILED="false"

          if [ "$ACTIVE_MODEL" = "opencode/deepseek-v4.1-flash-free" ] && [ "$EXIT_CODE" -ne 0 ]; then
            if grep -qiE "429|FreeUsageLimitError|Free usage limit reached|usage limit reached" "$LOG_FILE"; then
              DEEPSEEK_LIMITED="true"
              if [ "$HY4_COOLING" != "true" ]; then
                echo "DeepSeek limit hit; falling back to opencode/hy4-flash-free..." >> "$LOG_FILE"
                ACTIVE_MODEL="opencode/hy4-flash-free"
                run_model "$ACTIVE_MODEL"
                EXIT_CODE=$?
                if [ "$EXIT_CODE" -ne 0 ]; then
                  HY4_FAILED="true"
                  echo "Hy4 Flash fallback also failed (exit $EXIT_CODE); reverting default to DeepSeek." >> "$LOG_FILE"
                  ACTIVE_MODEL="opencode/deepseek-v4.1-flash-free"
                fi
              fi
            fi
          elif [ "$ACTIVE_MODEL" = "opencode/hy4-flash-free" ] && [ "$EXIT_CODE" -ne 0 ]; then
            HY4_FAILED="true"
            echo "Hy4 Flash failed (exit $EXIT_CODE); reverting default to DeepSeek." >> "$LOG_FILE"
            ACTIVE_MODEL="opencode/deepseek-v4.1-flash-free"
          fi

          {
            echo "opencode_exit=$EXIT_CODE"
            echo "active_model=$ACTIVE_MODEL"
            echo "deepseek_limited=$DEEPSEEK_LIMITED"
            echo "hy4_failed=$HY4_FAILED"
          } >> "$GITHUB_ENV"

      - name: Post-run adaptive adjustment & summary
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          STATE_FILE="$HOME/.local/share/opencode/autopilot-state.json"
          LOG_FILE="$RUNNER_TEMP/opencode-run.log"
          export STATE_FILE LOG_FILE

          node - <<'NODE_EOF'
          const fs = require("fs");
          const stateFile = process.env.STATE_FILE;
          const logFile = process.env.LOG_FILE;

          const exitCode = Number(process.env.opencode_exit ?? 1);
          const activeModel = process.env.active_model || "opencode/deepseek-v4.1-flash-free";
          const deepseekLimited = process.env.deepseek_limited === "true";
          const hy4Failed = process.env.hy4_failed === "true";
          const logText = fs.existsSync(logFile) ? fs.readFileSync(logFile, "utf8") : "";

          let state = {
            deepseekCooldownUntil: 0,
            hy4CooldownUntil: 0,
            consecutiveDeepseekLimits: 0,
            consecutiveTimeouts: 0,
            timeoutMins: 12,
            recentRuns: []
          };
          if (fs.existsSync(stateFile)) {
            try { state = { ...state, ...JSON.parse(fs.readFileSync(stateFile, "utf8")) }; } catch {}
          }

          const now = Date.now();
          const dayAgo = now - 24 * 60 * 60 * 1000;
          state.recentRuns = (state.recentRuns || []).filter((ts) => ts > dayAgo);
          state.recentRuns.push(now);

          const notes = [];

          if (deepseekLimited) {
            state.consecutiveDeepseekLimits = (state.consecutiveDeepseekLimits || 0) + 1;
            const backoffMins = Math.min(240, 60 * Math.pow(2, state.consecutiveDeepseekLimits - 1));
            state.deepseekCooldownUntil = now + backoffMins * 60 * 1000;
            notes.push(`DeepSeek limit hit (${backoffMins}m cooldown)`);
          }

          if (hy4Failed) {
            state.hy4CooldownUntil = now + 6 * 60 * 60 * 1000;
            notes.push("Hy4 Flash failed (6h cooldown, reverted to DeepSeek)");
          }

          if (exitCode === 124) {
            state.consecutiveTimeouts = (state.consecutiveTimeouts || 0) + 1;
            state.timeoutMins = Math.min(20, (Number(state.timeoutMins) || 12) + 4);
            notes.push(`Timeout 124 (next timeoutMins=${state.timeoutMins})`);
          } else if (exitCode === 0) {
            if (!deepseekLimited && activeModel === "opencode/deepseek-v4.1-flash-free") {
              state.deepseekCooldownUntil = 0;
              state.consecutiveDeepseekLimits = 0;
            }
            if (activeModel === "opencode/hy4-flash-free") {
              state.hy4CooldownUntil = 0;
            }
            state.consecutiveTimeouts = 0;
            state.timeoutMins = Math.max(12, (Number(state.timeoutMins) || 12) - 2);
            notes.push(`Succeeded on ${activeModel} (next timeoutMins=${state.timeoutMins})`);
          }

          fs.writeFileSync(stateFile, JSON.stringify(state, null, 2));

          const summary = [
            "### OpenCode Autopilot Run",
            `- **Final model:** \`${activeModel}\``,
            `- **Exit code:** \`${exitCode}\``,
            `- **State update:** ${notes.join("; ") || "None"}`,
            `- **24h tracked runs:** ${state.recentRuns.length}`,
            "",
            "<details><summary>OpenCode log tail (last 60 lines)</summary>",
            "",
            "```text",
            logText.split(/\r?\n/).slice(-60).join("\n"),
            "```",
            "</details>"
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
          NODE_EOF

          opencode stats --days 1 || true

      - name: Save OpenCode state & stats DB
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/opencode
          key: opencode-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload OpenCode log
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-run-log
          path: ${{ runner.temp }}/opencode-run.log
          if-no-files-found: ignore

      - name: Fail if OpenCode errored
        if: steps.gate.outputs.skip != 'true' && env.opencode_exit != '' && env.opencode_exit != '0'
        run: |
          echo "::error::opencode exited with ${opencode_exit} - see Summary tab or opencode-run-log artifact"
          cat "$RUNNER_TEMP/opencode-run.log" || true
          exit 1

      # opencode can print an error and still exit 0 (observed: the free-tier
      # version gate). An exit code alone therefore proves nothing, so a run
      # that leaves the tree untouched made no progress: fail loudly instead of
      # reporting a green no-op.
      - name: Fail if the agent made no changes
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Agent touched $(git status --porcelain | wc -l) path(s)."
            exit 0
          fi
          echo "::error::OpenCode made no file changes - it errored or refused to work. Log tail:"
          cat "$RUNNER_TEMP/opencode-run.log" || true
          exit 1

      # opencode.json denies edits to these paths, but the run uses
      # --dangerously-skip-permissions, so enforce the same rule here before
      # anything can be committed.
      - name: Refuse to commit human-owned files
        if: steps.gate.outputs.skip != 'true'
        run: |
          CHANGED=$(git status --porcelain -- .github/workflows opencode.json)
          if [ -n "$CHANGED" ]; then
            echo "::error::The agent modified files reserved for humans:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Verify build & tests
        if: steps.gate.outputs.skip != 'true'
        id: verify
        continue-on-error: true
        run: |
          npm run typecheck
          npm test
          PAGES_BASE_PATH="/resume-maker" npm run build

      - name: Commit & push progress
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          git config user.name "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::No file changes to commit."
            exit 1
          fi

          save_checkpoint() {
            echo "::warning::Verification or push failed - saving checkpoint branch"
            git rebase --abort 2>/dev/null || true
            git checkout -B wip/opencode-checkpoint
            git add -A
            git commit -m "wip(opencode): checkpoint partial progress"
            git push -f origin wip/opencode-checkpoint
          }

          if [ "${{ steps.verify.outcome }}" != "success" ]; then
            save_checkpoint
            exit 0
          fi

          git add -A
          git commit -m "chore(opencode): complete task & update TASKS.md"

          if ! git fetch origin main; then
            echo "::error::git fetch failed"
            exit 1
          fi

          if ! git rebase origin/main; then
            echo "::error::rebase onto main conflicted"
            save_checkpoint
            exit 0
          fi

          if ! git push origin HEAD:main; then
            echo "::error::push to main rejected"
            save_checkpoint
            exit 0
          fi

          git push origin --delete wip/opencode-checkpoint 2>/dev/null || true

          # A push authenticated with GITHUB_TOKEN does not trigger other workflows,
          # so deploy.yml must be started manually in that case. A PAT push already
          # triggers deploy.yml on push, so dispatching again would deploy twice.
          if [ -n "$PAT" ]; then
            echo "Pushed with GH_PAT - deploy.yml triggered by the push."
          else
            gh workflow run deploy.yml --ref main || echo "::warning::could not dispatch deploy.yml"
          fi
