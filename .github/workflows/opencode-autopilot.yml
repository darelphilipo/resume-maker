name: OpenCode Autopilot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: opencode-autopilot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build-next-task:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resume WIP checkpoint if ahead of main
        run: |
          if git ls-remote --exit-code --heads origin wip/opencode-checkpoint >/dev/null 2>&1; then
            AHEAD=$(git rev-list --count origin/main..origin/wip/opencode-checkpoint)
            if [ "$AHEAD" -gt 0 ]; then
              echo "Resuming from wip/opencode-checkpoint ($AHEAD commit(s) ahead of main)"
              git checkout -B work-branch origin/wip/opencode-checkpoint
            fi
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install OpenCode CLI
        # The free tier refuses to run below 1.18.0 and still exits 0:
        #   "Error: OpenCode 1.18.0 or newer is required to use the free tier"
        # Do not downgrade this pin.
        run: npm install -g opencode-ai@1.19.5

      - name: Run OpenCode on 1 task from TASKS.md
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_KEY }}
        run: |
          set +e
          PROMPT=$(cat <<'PROMPT_EOF'
          Read AGENTS.md , TASKS.md and CONTEXT.md first.

          1. If there is an item under 'In Progress', continue it. Otherwise, pick the single top unchecked item from 'Queue' (or promote 1 clear item from 'Inbox' if Queue is empty).
          2. Move that item to 'In Progress' in TASKS.md with a brief plan and target file paths.
          3. Implement the change cleanly following mobile-first, static-export, and existing test conventions. Add or update unit tests where appropriate.
          4. Run: npm run typecheck && npm test
          5. If checks pass, move the item to 'Done' in TASKS.md (with date and files changed). If you hit errors or run short on time, keep it under 'In Progress' with exact next steps for the next run.
          6. Stop after this single task. Do NOT run git commit or git push.
          PROMPT_EOF
          )
          timeout 20m opencode run \
            --dangerously-skip-permissions \
            -m opencode/deepseek-v4.1-flash-free \
            "$PROMPT" 2>&1 | tee "$RUNNER_TEMP/opencode-run.log"
          echo "opencode_exit=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Fail if OpenCode errored
        if: env.opencode_exit != '' && env.opencode_exit != '0'
        run: |
          echo "::error::opencode exited with ${opencode_exit} - see the opencode-run-log artifact"
          tail -n 40 "$RUNNER_TEMP/opencode-run.log" || true
          exit 1

      # opencode can print an error and still exit 0 (observed: the free-tier
      # version gate). An exit code alone therefore proves nothing, so a run
      # that leaves the tree untouched made no progress: fail loudly instead of
      # reporting a green no-op.
      - name: Fail if the agent made no changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Agent touched $(git status --porcelain | wc -l) path(s)."
            exit 0
          fi
          echo "::error::OpenCode made no file changes - it errored or refused to work. Log tail:"
          tail -n 40 "$RUNNER_TEMP/opencode-run.log" || true
          exit 1

      # opencode.json denies edits to these paths, but the run uses
      # --dangerously-skip-permissions, so enforce the same rule here before
      # anything can be committed.
      - name: Refuse to commit human-owned files
        run: |
          CHANGED=$(git status --porcelain -- .github/workflows opencode.json)
          if [ -n "$CHANGED" ]; then
            echo "::error::The agent modified files reserved for humans:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Upload OpenCode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-run-log
          path: ${{ runner.temp }}/opencode-run.log
          if-no-files-found: ignore

      - name: Verify build & tests
        id: verify
        continue-on-error: true
        run: |
          npm run typecheck
          npm test
          PAGES_BASE_PATH="/resume-maker" npm run build

      - name: Commit & push progress
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          git config user.name "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::No file changes to commit."
            exit 1
          fi

          save_checkpoint() {
            echo "::warning::Verification or push failed - saving checkpoint branch"
            git rebase --abort 2>/dev/null || true
            git checkout -B wip/opencode-checkpoint
            git add -A
            git commit -m "wip(opencode): checkpoint partial progress"
            git push -f origin wip/opencode-checkpoint
          }

          if [ "${{ steps.verify.outcome }}" != "success" ]; then
            save_checkpoint
            exit 0
          fi

          git add -A
          git commit -m "chore(opencode): complete task & update TASKS.md"

          if ! git fetch origin main; then
            echo "::error::git fetch failed"
            exit 1
          fi

          if ! git rebase origin/main; then
            echo "::error::rebase onto main conflicted"
            save_checkpoint
            exit 0
          fi

          if ! git push origin HEAD:main; then
            echo "::error::push to main rejected"
            save_checkpoint
            exit 0
          fi

          git push origin --delete wip/opencode-checkpoint 2>/dev/null || true

          # A push authenticated with GITHUB_TOKEN does not trigger other workflows,
          # so deploy.yml must be started manually in that case. A PAT push already
          # triggers deploy.yml on push, so dispatching again would deploy twice.
          if [ -n "$PAT" ]; then
            echo "Pushed with GH_PAT - deploy.yml triggered by the push."
          else
            gh workflow run deploy.yml --ref main || echo "::warning::could not dispatch deploy.yml"
          fi
